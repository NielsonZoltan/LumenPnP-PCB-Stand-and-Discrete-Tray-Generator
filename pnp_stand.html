<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LumenPnP Stand Generator</title>
<style>
:root {
  --bg: #f4f5f7; --panel: #ffffff; --ink: #1d2330; --muted: #5d6677; --line: #d9dde4;
  --accent: #2463eb; --accent-ink: #ffffff; --ok: #1f8a4c; --bad: #c83232; --warn: #b7791f;
  --plate: #23272f; --plate-edge: #3a404c; --hole: #d6a65a; --hole-off: #4a505c; --label: #c9b27a;
  --pcb: rgba(31, 138, 76, .55); --pcb-edge: #2fd07a; --stand: rgba(64, 140, 255, .55); --stand-edge: #8db8ff;
  --zone: rgba(200, 50, 50, .28); --zone-edge: #ff7070; --input: #ffffff;
  --tray: rgba(235, 140, 40, .30); --tray-lane: rgba(235, 140, 40, .55); --tray-edge: #ffb054;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #12151b; --panel: #1a1e26; --ink: #e5e8ee; --muted: #98a1b3; --line: #2c323d;
    --accent: #5b8cff; --accent-ink: #0b0e13; --ok: #3ccf7f; --bad: #ff6b6b; --warn: #f0b54a; --input: #12151b;
  }
}
:root[data-theme="dark"] {
  --bg: #12151b; --panel: #1a1e26; --ink: #e5e8ee; --muted: #98a1b3; --line: #2c323d;
  --accent: #5b8cff; --accent-ink: #0b0e13; --ok: #3ccf7f; --bad: #ff6b6b; --warn: #f0b54a; --input: #12151b;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--ink); font: 13px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; }
.app { display: grid; grid-template-columns: 330px 1fr 340px; grid-template-rows: auto 1fr; grid-template-areas: "top top top" "left main right"; height: 100vh; }
.topbar { grid-area: top; display: flex; flex-wrap: wrap; align-items: center; gap: 6px 14px; padding: 6px 10px; background: var(--panel); border-bottom: 1px solid var(--line); }
.topbar .brand { font-weight: 700; font-size: 14px; display: inline-flex; align-items: center; }
.tgroup { display: flex; flex-wrap: wrap; align-items: center; gap: 4px; padding-left: 12px; border-left: 1px solid var(--line); }
.topbar .brand + .tgroup { border-left: 0; padding-left: 0; }
.topbar select { max-width: 170px; }
.topbar .chips { margin: 0 0 0 auto; }
aside { background: var(--panel); overflow-y: auto; padding: 6px 12px 40px; }
#left { grid-area: left; border-right: 1px solid var(--line); }
#right { grid-area: right; border-left: 1px solid var(--line); padding-top: 0; }
main { grid-area: main; }
details.adv { border-top: 1px dashed var(--line); margin-top: 4px; }
.rtabs { position: sticky; top: 0; z-index: 2; display: flex; gap: 2px; background: var(--panel); padding: 6px 0; border-bottom: 1px solid var(--line); }
.rtabs button { flex: 1; border-radius: 6px 6px 0 0; }
.rtabs button.on { border-color: var(--accent); color: var(--accent); font-weight: 600; }
.objlist { margin: 6px 0; border: 1px solid var(--line); border-radius: 6px; max-height: 38vh; overflow-y: auto; }
.obj { display: flex; align-items: center; gap: 6px; padding: 3px 8px; cursor: pointer; border-bottom: 1px solid var(--line); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.obj:last-child { border-bottom: 0; }
.obj.grp { font-weight: 600; background: var(--bg); }
.obj.kid { padding-left: 22px; }
.obj:hover { background: var(--bg); }
.obj.sel { background: var(--accent); color: var(--accent-ink); }
.obj .st { margin-left: auto; font-size: 11px; }
.obj.sel .st { color: inherit; }
.obj .dot { width: 9px; height: 9px; border-radius: 2px; flex: none; }
.props h2 { font-size: 14px; margin: 10px 0 4px; }
.pblock { display: none; }
.pblock.show { display: block; }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; font-size: 12px; margin: 4px 0; }
.kv > :nth-child(odd) { color: var(--muted); }
#rParts { padding-top: 6px; }
main { position: relative; overflow: hidden; display: flex; flex-direction: column; }
h1 { font-size: 16px; margin: 4px 0 2px; }
.sub { color: var(--muted); margin: 0 0 8px; }
details { border-top: 1px solid var(--line); padding: 6px 0; }
summary { cursor: pointer; font-weight: 600; padding: 4px 0; }
label { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: 3px 0; }
label > span { color: var(--muted); }
input, select, textarea, button { font: inherit; color: var(--ink); }
input[type=number], input[type=text], select, textarea { background: var(--input); border: 1px solid var(--line); border-radius: 5px; padding: 3px 6px; }
input[type=number] { width: 78px; }
aside select { max-width: 200px; }
aside { overflow-x: hidden; }
label > span { min-width: 0; }
input[type=text].w { width: 120px; }
textarea { width: 100%; min-height: 110px; font: 12px/1.35 ui-monospace, Consolas, monospace; }
button { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 5px 10px; cursor: pointer; }
button:hover { border-color: var(--accent); }
button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.row { display: flex; flex-wrap: wrap; gap: 6px; margin: 6px 0; }
.err { color: var(--bad); white-space: pre-wrap; }
.okc { color: var(--ok); }
.muted { color: var(--muted); }
table { border-collapse: collapse; width: 100%; font-size: 12px; }
th, td { border-bottom: 1px solid var(--line); padding: 2px 3px; text-align: left; }
td input[type=number] { width: 58px; }
.plate-cfg { border: 1px solid var(--line); border-radius: 6px; padding: 4px 8px; margin: 4px 0; }
.toolbar { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; padding: 8px 10px; border-bottom: 1px solid var(--line); background: var(--panel); }
.toolbar .status { margin-left: auto; font-weight: 600; }
#view { flex: 1; width: 100%; height: 100%; touch-action: none; cursor: grab; background: var(--bg); user-select: none; -webkit-user-select: none; }
.toolbar, .legend { user-select: none; -webkit-user-select: none; }#view.dragging { cursor: grabbing; }
.legend { position: absolute; left: 10px; bottom: 10px; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; font-size: 12px; color: var(--muted); max-width: 520px; }
.out { font: 12px/1.4 ui-monospace, Consolas, monospace; white-space: pre-wrap; background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 6px; }
.info { display: inline-flex; align-items: center; justify-content: center; width: 15px; height: 15px; border-radius: 50%; border: 1px solid var(--muted); color: var(--muted); font: italic 700 10px/1 Georgia, serif; cursor: help; margin-left: 5px; vertical-align: 1px; flex: none; }
.info:hover, .info:focus { border-color: var(--accent); color: var(--accent); outline: none; }
#tipBox { position: fixed; z-index: 50; max-width: 320px; background: var(--panel); color: var(--ink); border: 1px solid var(--line); border-radius: 6px; padding: 7px 9px; font-size: 12px; line-height: 1.45; box-shadow: 0 4px 16px rgba(0,0,0,.25); pointer-events: none; display: none; }
#tipBox code { font-size: 11px; }
.chips { display: flex; flex-wrap: wrap; gap: 4px; margin: 4px 0 8px; }
.chip { font-size: 11px; padding: 2px 7px; border-radius: 10px; border: 1px solid var(--line); color: var(--muted); cursor: pointer; background: var(--bg); }
.chip.ok { color: var(--ok); border-color: var(--ok); }
.chip.warn { color: var(--warn); border-color: var(--warn); }
.chip.bad { color: var(--bad); border-color: var(--bad); }
.frame { border: 1px solid var(--line); border-radius: 6px; padding: 4px 8px; margin: 4px 0; }
#fidTable input[type=number] { width: 72px; }
@media (max-width: 1200px) {
  .app { grid-template-columns: 300px 1fr; grid-template-rows: auto 70vh auto; grid-template-areas: "top top" "left main" "right right"; height: auto; min-height: 100vh; }
  #left { max-height: 70vh; }
  #right { border-left: 0; border-top: 1px solid var(--line); }
}
@media (max-width: 800px) {
  .app { grid-template-columns: 1fr; grid-template-rows: auto auto 70vh auto; grid-template-areas: "top" "left" "main" "right"; }
  #left { max-height: none; border-right: 0; border-bottom: 1px solid var(--line); padding: 10px 16px; }
  .tgroup { border-left: 0; padding-left: 0; }
}
@media print {
  aside, .topbar, .toolbar, .legend, #tipBox { display: none !important; }
  .app { display: block; height: auto; }
  main { overflow: visible; }
  #view { height: 120mm; }
  body { background: #fff; }
}
</style>
</head>
<body>
<div class="app">
<header class="topbar">
  <span class="brand">LumenPnP stands<span class="info" tabindex="0" data-tip="Stands, cut-tape holders and an OpenPnP starter for the LumenPnP staging plates. <b>Left</b>: setup (machine, board, stand, cut tape, machine position). <b>Middle</b>: the plates: drag the board, a tray or a feeder, click anything to see it on the right. <b>Right</b>: what's on the plates and its properties; <i>Parts</i> is the BOM. Everything is saved in this browser; <i>Save</i> writes a project file for another computer.">i</span></span>
  <div class="tgroup">
    <button id="openPcb" title="Open a .kicad_pcb">📂 Board</button><input type="file" id="pcbFile" accept=".kicad_pcb" hidden>
    <button id="openBom" title="KiCad BOM CSV (Qty per board), or a DigiKey order CSV (Qty = what you ordered; needs the .kicad_pcb open)">📂 BOM / order</button><input type="file" id="bomFile" accept=".csv" hidden>
    <button id="loadBtn" title="Open a project file (.json)">📂 Project</button><input type="file" id="loadFile" accept=".json" hidden>
    <button id="saveBtn" title="Save the project file (.json): board, stands, BOM, trays / feeders, machine position">💾 Save</button>
    <select id="recentSel" title="Layouts saved in this browser, one per board"></select><span class="info" tabindex="0" data-tip="<b>This browser</b> keeps every board’s layout on its own (board, stands, BOM, trays / feeders, machine position, taught fiducials), saved as you go: pick one under <i>saved boards</i>, and opening a .kicad_pcb you laid out before offers its layout back. <b>Project file</b> (.json): the same thing as a file, to move to another computer or keep next to the board in the repo (e.g. <code>openpnp/&lt;board&gt;_project.json</code>).">i</span>
  </div>
  <div class="tgroup">
    <button class="primary" id="autoBtn" title="Place the board where its stands fit (rotations and preference: select the board)">Auto-place board</button>
    <button id="trayPackBtn" title="Repack the sections and auto-place every tray / feeder (forgets ones you moved)">Pack + place feeders</button>
  </div>
  <div class="tgroup">
    <button class="printMap" title="Placement map + loading list (letter landscape): grid holes for stands and trays / feeders, which strip goes where">🖨 Print map</button>
    <button id="opBtn" title="OpenPnP starter project (.zip); needs a machine position (left, 5)">OpenPnP (.zip)</button>
    <button id="allBtn" title="One zip: stand STLs, tray STLs (trays), setup CSV, print sheet, OpenPnP project, project JSON">Export everything</button>
  </div>
  <div class="chips" id="chips"></div>
</header>

<aside id="left">
  <details>
    <summary>1 · Machine</summary>
    <label><span>Profile</span><select id="profile"></select></label>
    <label><span>Plates</span><select id="nPlates"><option>1</option><option selected>2</option><option>3</option></select></label>
    <div id="plateCfg"></div>
    <label><span>Row 1 at</span><select id="row1"><option value="left">left (low X)</option><option value="right">right (high X)</option></select></label>
    <details>
      <summary class="muted">Plate dimensions</summary>
      <label><span>Length (mm)</span><input type="number" id="pl_length" step="1"></label>
      <label><span>Width (mm)</span><input type="number" id="pl_width" step="1"></label>
      <label><span>Hole pitch (mm)</span><input type="number" id="pl_pitch" step="0.1"></label>
      <label><span>First hole from edge</span><input type="number" id="pl_edge" step="0.1"></label>
      <label><span>Gap between plates</span><input type="number" id="pl_gap" step="0.1"></label>
      <label><span>Plate screw inset</span><input type="number" id="pl_screwInset" step="0.5"></label>
      <label><span>Plate screw keep-out ⌀</span><input type="number" id="pl_screwKeepD" step="0.5"></label>
    </details>
    <div class="muted" style="margin-top:6px">Keep-outs<span class="info" tabindex="0" data-tip="One per line: <code>camera d20 52</code> (also the target for “near the camera” and for feeder placement), <code>circle E12 30</code>, <code>rect d16 g19 [margin]</code>, <code>block c5 e5</code>, <code>circle@ x y d</code>, <code>rect@ x0 y0 x1 y1</code>. Click a grid hole in the view to block or unblock it.">i</span></div>
    <textarea id="keepouts" spellcheck="false"></textarea>
    <div id="koErr" class="err"></div>
    <div class="muted"><span id="clickBlocked"></span></div>
  </details>

  <details open>
    <summary>2 · Board</summary>
    <label><span>Min hole ⌀ on import</span><input type="number" id="minDrill" value="1.0" step="0.1"></label>
    <div class="row">
      <label style="margin:0"><span>W</span><input type="number" id="manW" value="80" step="0.1"></label>
      <label style="margin:0"><span>H</span><input type="number" id="manH" value="60" step="0.1"></label>
      <button id="manRect" title="Rectangle with a hole in each corner, 4 mm in">Plain rectangle</button>
    </div>
    <div id="pcbInfo" class="muted"></div>
    <div id="pcbReport" class="muted" style="margin-top:3px"></div>
    <label><span>Board thickness (from file)</span><input type="number" id="sp_pcbThick" step="0.01" min="0.2" title="Sets the pin length and the corner wall height"></label>
    <label><span>Fix the board by</span><select id="pcbMode"><option value="holes">mounting / tooling holes</option><option value="corners">board corners (L-wall stands)</option></select></label>
    <div id="cornerBox" class="row"></div>
    <table id="holeTable"><thead><tr><th>mount</th><th>ref</th><th>u</th><th>v</th><th>⌀</th><th></th></tr></thead><tbody></tbody></table>
    <div class="row"><button id="addHole">+ hole</button><span class="info" tabindex="0" data-tip="u / v in mm from the board's lower-left corner, top view. Tick the holes the stands should use.">i</span></div>
  </details>

  <details open>
    <summary>3 · Stands</summary>
    <label><span>Height: plate → PCB bottom</span><input type="number" id="sp_height" step="0.5"></label>
    <label><span>Bolts per stand</span><select id="sp_bolts"><option value="2">2 (angle locked)</option><option value="1">1 (can swing)</option></select></label>
    <label><span>Top of bolt hole</span><select id="sp_pocket"><option value="hex">hex nut trap</option><option value="round">screw-head counterbore</option><option value="none">plain hole</option></select></label>
    <label><span>Bolt size preset</span><select id="boltPreset" title="Fills clearance, nut and head sizes (stands and tray caps). Then fine-tune the fields below"><option value="">– pick to fill –</option></select></label>
    <label><span>Floor under nut</span><input type="number" id="sp_pocketFloor" step="0.05" min="0.4" title="Plastic left under the nut (or screw head). The pocket fills the body above it, so it is body top − this"></label>
    <label><span>PCB fixing</span><select id="sp_iface"><option value="pin">printed locating pin</option><option value="hole">blind hole (dowel / screw / insert)</option></select></label>
    <label><span>Clearance under board</span><input type="number" id="sp_underClear" step="0.5" min="0" title="Tallest part on the side facing the plate, e.g. the top-side parts when placing the bottom side. Raises the step-up (and the height if needed)"></label>
    <details class="adv">
      <summary class="muted">Advanced</summary>
    <label><span>Bolt clearance ⌀</span><input type="number" id="sp_boltD" step="0.1"></label>
    <label><span>Nut across flats</span><input type="number" id="sp_nutAF" step="0.1"></label>
    <label><span>Nut height</span><input type="number" id="sp_nutH" step="0.1" min="0" title="Checked against the pocket depth (warns if the nut sticks out); tray caps are floor + this tall"></label>
    <label><span>Head ⌀</span><input type="number" id="sp_headD" step="0.1"></label>
    <label><span>Pocket clearance</span><input type="number" id="sp_pocketClr" step="0.05"></label>
    <label><span>Step-up (body below PCB by)</span><input type="number" id="sp_stepH" step="0.5" min="0" title="Only the boss under the pin (or the corner pad) reaches the PCB; the rest of the body is this much lower. 0 = flat top"></label>
    <label><span>Boss ⌀ under pin (0 = auto)</span><input type="number" id="sp_bossD" step="0.1" min="0"></label>
    <label><span>Pin clearance (radial)</span><input type="number" id="sp_pinClr" step="0.05"></label>
    <label><span>Pin tip above board top</span><input type="number" id="sp_pinAbove" step="0.1" title="Pin length = board thickness + this. Negative = the pin stops inside the hole"></label>
    <label><span>Blind hole ⌀ (0 = PCB hole)</span><input type="number" id="sp_ifaceHoleD" step="0.1"></label>
    <label><span>Blind hole depth</span><input type="number" id="sp_ifaceHoleDepth" step="0.5"></label>
    <label><span>Wall</span><input type="number" id="sp_wall" step="0.1"></label>
    <label><span>Min pad radius under PCB</span><input type="number" id="sp_padMin" step="0.1"></label>
    <label><span>Max arm (PCB hole → bolt)</span><input type="number" id="sp_maxArm" step="1"></label>
    <label><span>Max bolt spacing</span><input type="number" id="sp_maxPair" step="1"></label>
    <label><span>Penalty: bolt under PCB</span><input type="number" id="sp_underPenalty" step="1"></label>
    <label><span>Gap between stands</span><input type="number" id="sp_standGap" step="0.5"></label>
    <label><span>Engrave number on side</span><select id="sp_label"><option value="1">yes (1 = board lower-left, anticlockwise)</option><option value="0">no</option></select></label>
    <label><span>Number height / depth</span><span><input type="number" id="sp_labelH" step="0.5"> <input type="number" id="sp_labelDepth" step="0.1"></span></label>
    <div class="muted" style="margin-top:6px">Corner mode</div>
    <label><span>Support pad (square)</span><input type="number" id="sp_cornerPad" step="0.5"></label>
    <label><span>Edge clearance</span><input type="number" id="sp_cornerGap" step="0.05"></label>
    <label><span>L-wall thickness</span><input type="number" id="sp_cornerWall" step="0.1"></label>
    <label><span>L-wall top below board top</span><input type="number" id="sp_lipBelow" step="0.1"></label>
    <div class="row"><button id="spReset" title="Back to the built-in defaults (our stand: 8.6 mm riser, 6.14 mm body, 5.34 mm nut, 1.93 mm under it). Keeps the board thickness.">Reset stand to defaults</button></div>
    </details>
  </details>

  <details open>
    <summary>4 · Cut tape<span class="info" tabindex="0" data-tip="One BOM line per reel (grouped by normalised value + footprint). Each line gets a section of cut tape: (parts + empty pockets) × pitch. <b>Our trays</b>: sections share lanes, lanes share trays, printed here. <b>Opulo tray feeders</b>: sections go end to end in the channels of Opulo’s printed feeders (8 / 12 mm: 3 channels) with a gap between them, busiest feeders nearest the bottom camera; OpenPnP gets one tray feeder per section. Drag a tray or feeder to move it.">i</span></summary>
    <label><span>Holder</span><select id="tp_holder"><option value="tray">our cut-tape trays (printed here)</option><option value="opulo">Opulo LumenPnP printed tray feeders</option></select></label>
    <div id="bomInfo" class="muted"></div>
    <label><span>Boards per run</span><input type="number" id="tp_boards" step="1" min="1"></label>
    <label><span>Spare parts per line</span><input type="number" id="tp_spares" step="1" min="0"></label>
    <label><span>Empty pockets at the start</span><input type="number" id="tp_leader" step="1" min="0"></label>
    <div id="opuloOnly">
      <label><span>Feeders you have</span><input type="text" id="tp_opHave" placeholder="e.g. 8:10 12:2" title="Per tape width, how many Opulo feeders you own (W:count). The plan reports a shortage. Empty = no limit"></label>
      <label><span>Line longer than a channel</span><select id="tp_opRefill" title="Split: the line takes as many channels as it needs. Refill: it gets one full channel; slide more tape in as it runs out and reset the feeder's count"><option value="0">split over channels</option><option value="1">one channel, refill as it runs out</option></select></label>
      <label><span>Gap between sections</span><input type="number" id="tp_opGap" step="1" min="0" title="Space between two cut strips in one channel, mm"></label>
      <label><span>Orientation</span><select id="tp_opOrient"><option value="90">90°: channels front → back (bolts like A15 + G15)</option><option value="180">180°: channels along the rows</option></select></label>
      <details>
        <summary class="muted">Feeder dimensions</summary>
        <label><span>Feeder types</span><input type="text" id="tp_opTypes" title="One per tape width: W:channels:width across[:channel pitch]. Opulo: 8 and 12 mm have 3 channels, 16 mm 2, 24 / 32 mm 1. 8 / 12 mm width and the 15 mm pitch from Opulo's CAD (the host's tray feeders sit 14.9 mm apart); 16 / 24 / 32 are guesses"></label>
        <label><span>Usable channel length</span><input type="number" id="tp_opUsable" step="1" min="10" title="Channel length that can hold parts (feeder 120 mm; Opulo cuts 125 mm strips, 30 parts at 4 mm; guess 116)"></label>
        <label><span>Feeder length</span><input type="number" id="tp_opLen" step="1"></label>
        <label><span>Pick Z above plate</span><input type="number" id="tp_opZ" step="0.1" title="Tray feeder pick Z for OpenPnP, above the plate top. Measured: 10.5-10.8 (picks at Z 14.9-15.2 with the plate top at 4.4). Check one feeder on the machine"></label>
      </details>
    </div>
    <div id="trayOnly">
    <label><span>Max tray width</span><input type="number" id="tp_maxTrayW" step="5" min="20"></label>
    <label><span>Lane length (0 = least area)</span><input type="number" id="tp_laneLen" step="15" min="0"></label>
    <label><span>Sections per lane</span><select id="tp_series"><option value="1">several, end to end</option><option value="0">one (one lane per line)</option></select></label>
    <details>
      <summary class="muted">Tray dimensions</summary>
      <label><span>Channel = tape + </span><input type="number" id="tp_chClr" step="0.05"></label>
      <label><span>Rib between lanes</span><input type="number" id="tp_rib" step="0.1"></label>
      <label><span>Side wall</span><input type="number" id="tp_sideWall" step="0.1"></label>
      <label><span>Floor under pocket relief</span><input type="number" id="tp_base" step="0.1"></label>
      <label><span>Paper tape recess</span><input type="number" id="tp_recessPaper" step="0.1"></label>
      <label><span>Embossed shoulder recess</span><input type="number" id="tp_recessEmb" step="0.1"></label>

<script>

const S = window.PnpStand, TR = window.PnpTray, OP = window.PnpOpenPnP, FIT = window.PnpFit, SH = window.PnpSheet;
// the browser can keep an old copy of the core after an update; say so instead of failing later
const CORE_VERSION = 5, TRAY_VERSION = 5, OPENPNP_VERSION = 3, FIT_VERSION = 2, SHEET_VERSION = 1;
if (!S || S.VERSION !== CORE_VERSION || !TR || TR.VERSION !== TRAY_VERSION || !OP || OP.VERSION !== OPENPNP_VERSION || !FIT || FIT.VERSION !== FIT_VERSION || !SH || SH.VERSION !== SHEET_VERSION) {
  addEventListener('DOMContentLoaded', () => {
    const b = document.createElement('div');
    b.textContent = `pnp_stand_core.js / pnp_tray_core.js / pnp_sheet.js is an old cached copy (needs core ${CORE_VERSION}, trays ${TRAY_VERSION}, OpenPnP ${OPENPNP_VERSION}, fit ${FIT_VERSION}, sheet ${SHEET_VERSION}). Press Ctrl+F5 to reload.`;
    b.style.cssText = 'position:fixed;top:0;left:0;right:0;z-index:99;padding:8px 12px;background:#b3261e;color:#fff;font:14px system-ui';
    document.body.appendChild(b);
  });
}
const $ = (id) => document.getElementById(id);
const NS = 'http://www.w3.org/2000/svg';
const LS_KEY = 'pnpStand.v1';

// ------------------------------------------------------------ state
const state = {
  profile: 'v3.1',
  cfg: JSON.parse(JSON.stringify(S.PROFILES['v3.1'])),
  keepouts: S.PROFILES['v3.1'].keepouts,
  clickBlocked: [],
  sp: { ...S.DEFAULT_STAND },
  pcb: null,
  place: { cx: 120, cy: 120, rot: 0 },
  rotAllowed: [0, 90, 180, 270],
  prefer: 'here',
  snap: 0.5,
  openpnp: { origin: 'bboxLL', hole: '', x: '', y: '', flipX: false, flipY: false },
  tray: { tp: { ...TR.DEFAULT_TRAY }, bom: null, pos: {}, opos: {}, layout: null },
  op: { notInTray: 'ignore', plateZ: 0, frame: 'fids', fidMode: 'machine', fids: {}, boardZ: '', fidPart: '' },
};
let M = null, KO = null, RES = null, TRAYS = null;

function loadLocal() {
  try {
    const s = JSON.parse(localStorage.getItem(LS_KEY) || 'null');
    if (s && s.cfg) Object.assign(state, s, { sp: { ...S.DEFAULT_STAND, ...s.sp }, tray: mergeTray(s.tray), op: { ...{ notInTray: 'ignore', plateZ: 0, frame: 'fids', fidMode: 'machine', fids: {}, boardZ: '', fidPart: '' }, ...(s.op || {}) } });
  } catch (e) { /* storage unavailable */ }
}
function mergeTray(t) { return { bom: null, pos: {}, opos: {}, layout: null, ...(t || {}), tp: { ...TR.DEFAULT_TRAY, ...((t && t.tp) || {}) } }; }
function saveLocal() { try { localStorage.setItem(LS_KEY, JSON.stringify(state)); } catch (e) { /* ignore */ } if (typeof saveBoardSlot === 'function') saveBoardSlot(); }

// ------------------------------------------------------------ machine form
function buildProfileSelect() {
  const sel = $('profile');
  sel.innerHTML = Object.entries(S.PROFILES).map(([k, p]) => `<option value="${k}">${p.label}</option>`).join('');
  sel.value = state.profile;
}
function plateCfgForm() {
  const box = $('plateCfg');
  box.innerHTML = '';
  state.cfg.plates.forEach((pl, i) => {
    const d = document.createElement('div');
    d.className = 'plate-cfg';
    d.innerHTML = `<label><span>Plate ${i + 1} (front → rear)</span><input type="text" class="w" data-k="name" value="${pl.name}"></label>
      <label><span>Letters</span><select data-k="lower"><option value="1">lowercase a–g</option><option value="0">UPPERCASE A–G</option></select></label>
      <label><span>A at</span><select data-k="aAt"><option value="front">front edge</option><option value="rear">rear edge</option></select></label>
      <label><span>Name prefix</span><input type="text" class="w" data-k="prefix" value="${pl.prefix || ''}" placeholder="e.g. 3 → 3D20"></label>`;
    d.querySelector('[data-k=lower]').value = pl.lower ? '1' : '0';
    d.querySelector('[data-k=aAt]').value = pl.aAt;
    d.querySelectorAll('[data-k]').forEach((el) => el.addEventListener('change', () => {
      const k = el.dataset.k;
      pl[k] = k === 'lower' ? el.value === '1' : el.value;
      rebuildMachine();
    }));
    box.appendChild(d);
  });
}
function setPlateCount(n) {
  const cur = state.cfg.plates;
  while (cur.length < n) {
    const i = cur.length;
    cur.push(i === 1 ? { name: 'Upper (rear)', lower: false, prefix: '', aAt: 'rear' } : { name: 'Plate ' + (i + 1), lower: false, prefix: String(i + 1), aAt: 'rear' });
  }
  cur.length = n;
}
const PL_KEYS = ['length', 'width', 'pitch', 'edge', 'gap', 'screwInset', 'screwKeepD'];
function machineFormFromState() {
  buildProfileSelect();
  $('nPlates').value = String(state.cfg.plates.length);
  $('row1').value = state.cfg.row1;
  PL_KEYS.forEach((k) => { $('pl_' + k).value = state.cfg.plate[k]; });
  $('keepouts').value = state.keepouts;
  plateCfgForm();
}

function rebuildMachine() {
  M = S.buildMachine(state.cfg);
  reparseKeepouts();
  drawStatic();
  update();
}
function reparseKeepouts() {
  KO = S.parseKeepouts(M, state.keepouts);
  for (const n of state.clickBlocked) KO.blocked.add(n);
  $('koErr').textContent = KO.errors.join('\n');
  $('clickBlocked').textContent = state.clickBlocked.length ? 'Blocked by click: ' + state.clickBlocked.join(' ') + ' ' : '';
  if (state.clickBlocked.length) {
    const a = document.createElement('a'); a.href = '#'; a.textContent = '(clear)';
    a.onclick = (e) => { e.preventDefault(); state.clickBlocked = []; reparseKeepouts(); drawStatic(); update(); };
    $('clickBlocked').appendChild(a);
  }
}

// ------------------------------------------------------------ stand form
const SP_KEYS = ['height', 'bolts', 'pocket', 'boltD', 'nutAF', 'nutH', 'headD', 'pocketFloor', 'pocketClr', 'iface', 'underClear', 'stepH', 'bossD', 'pinClr', 'pinAbove', 'ifaceHoleD', 'ifaceHoleDepth', 'wall', 'padMin', 'maxArm', 'maxPair', 'underPenalty', 'standGap',
  'label', 'labelH', 'labelDepth', 'cornerPad', 'cornerGap', 'cornerWall', 'lipBelow', 'pcbThick'];
/** stand settings with board-derived values (pin length, wall height, raised step-up for clearance) */
const ES = () => S.effectiveStand(state.sp);
function standFormFromState() { SP_KEYS.forEach((k) => { $('sp_' + k).value = k === 'label' ? (state.sp.label ? '1' : '0') : state.sp[k]; }); }
// bolt presets fill the bolt fields (stands and tray caps share them)
for (const [k, b] of Object.entries(S.BOLT_PRESETS)) {
  const o = document.createElement('option'); o.value = k;
  o.textContent = `${b.label}: hole ${b.boltD}, nut ${b.nutAF} AF × ${b.nutH}, head ${b.headD}`;
  $('boltPreset').appendChild(o);
}
$('boltPreset').addEventListener('change', (e) => {
  const b = S.BOLT_PRESETS[e.target.value];
  if (!b) return;
  Object.assign(state.sp, { boltD: b.boltD, nutAF: b.nutAF, nutH: b.nutH, headD: b.headD });
  standFormFromState(); e.target.value = ''; repackSoon(); update();
});
$('spReset').onclick = () => { state.sp = { ...S.DEFAULT_STAND, pcbThick: state.sp.pcbThick }; standFormFromState(); update(); };
SP_KEYS.forEach((k) => $('sp_' + k).addEventListener('input', (e) => {
  if (k === 'label') { state.sp.label = e.target.value === '1'; update(); return; }
  const v = e.target.tagName === 'SELECT' && isNaN(+e.target.value) ? e.target.value : +e.target.value;
  if (v === '' || (typeof v === 'number' && !isFinite(v))) return;
  state.sp[k] = v;
  update();
}));

// ------------------------------------------------------------ PCB
function setPcb(pcb, center) {
  if (state.pcb && state.pcb.name !== pcb.name) {
    // another board: its BOM, tray / feeder positions and taught fiducials don't carry over (the old board keeps them
    // in its saved slot, written here before anything changes); machine, stand and tray settings do
    saveBoardSlot();
    state.pcb = pcb; // from here on, saves go to the new board's slot
    state.tray = { ...state.tray, bom: null, pos: {}, opos: {}, layout: null };
    state.op = { ...state.op, fids: {}, boardZ: '' };
    state.openpnp = { ...state.openpnp, hole: '', x: '', y: '' };
    TRAYS = null;
    initForms(); lineTable();
  }
  state.pcb = pcb;
  if (center) {
    const ex = M.extent;
    state.place = { cx: Math.max(ex.x0 + pcb.W / 2, Math.min(ex.x1 - pcb.W / 2, state.place.cx)), cy: (ex.y0 + ex.y1) / 2, rot: 0, flip: !!state.place.flip };
  }
  if (pcb.thickness) { state.sp.pcbThick = pcb.thickness; $('sp_pcbThick').value = pcb.thickness; }
  holeTable();
  fidTable();
  update();
}
function holeTable() {
  const tb = $('holeTable').querySelector('tbody');
  tb.innerHTML = '';
  const p = state.pcb;
  $('pcbInfo').textContent = p ? `${p.name}: ${p.W.toFixed(2)} × ${p.H.toFixed(2)} mm, ${p.holes.length} hole(s)` : 'No board yet: open a .kicad_pcb or make a plain rectangle.';
  $('pcbReport').textContent = p && p.report ? 'Import: ' + p.report : '';
  if (!p) return;
  if (!p.mode) p.mode = 'holes';
  if (!p.corners) p.corners = [true, true, true, true];
  $('pcbMode').value = p.mode;
  $('holeTable').style.display = p.mode === 'holes' ? '' : 'none';
  $('addHole').parentElement.style.display = p.mode === 'holes' ? '' : 'none';
  const cb = $('cornerBox');
  cb.innerHTML = '';
  if (p.mode === 'corners') {
    cb.innerHTML = '<span class="muted">Corners:</span>';
    S.CORNERS.forEach((c, i) => {
      const l = document.createElement('label'); l.style.margin = '0';
      l.innerHTML = `<input type="checkbox" ${p.corners[i] ? 'checked' : ''}> ${i + 1} ${c.name}`;
      l.querySelector('input').onchange = (e) => { p.corners[i] = e.target.checked; update(); };
      cb.appendChild(l);
    });
  }
  p.holes.forEach((h, i) => {
    const tr = document.createElement('tr');
    tr.innerHTML = `<td><input type="checkbox" ${h.use ? 'checked' : ''} data-k="use"></td>
      <td><input type="text" style="width:52px" value="${h.ref}" data-k="ref" title="${h.note || ''}"></td>
      <td><input type="number" step="0.01" value="${h.u}" data-k="u"></td>
      <td><input type="number" step="0.01" value="${h.v}" data-k="v"></td>
      <td><input type="number" step="0.05" value="${h.d}" data-k="d"></td>
      <td><button data-del title="Remove">×</button></td>`;
    tr.querySelectorAll('[data-k]').forEach((el) => el.addEventListener('input', () => {
      const k = el.dataset.k;
      h[k] = k === 'use' ? el.checked : k === 'ref' ? el.value : +el.value;
      update();
    }));
    tr.querySelector('[data-del]').onclick = () => { p.holes.splice(i, 1); holeTable(); update(); };
    tb.appendChild(tr);
  });
}
$('openPcb').onclick = () => $('pcbFile').click();
$('pcbFile').addEventListener('change', async (e) => {
  const f = e.target.files[0];
  e.target.value = ''; // so opening the same file again after editing it in KiCad still fires
  if (!f) return;
  try {
    const pcb = S.importKicadPcb(await f.text(), f.name.replace(/\.kicad_pcb$/, ''), { minDrill: +$('minDrill').value || 1 });
    const saved = (!state.pcb || state.pcb.name !== pcb.name) && loadBoardSlot(pcb.name);
    if (saved && confirm(`${pcb.name} was laid out here before (stands, BOM, feeders, machine position).\n\nOK = restore that layout with this file's board · Cancel = start fresh`)) {
      saveBoardSlot(); applyState(saved, pcb); setStatus(`✓ ${pcb.name}: saved layout restored`, 'ok'); return;
    }
    if (state.pcb && state.pcb.name !== pcb.name) saveBoardSlot(); // keep the previous board's layout
    setPcb(pcb, true);
    if (pcb.mode === 'corners') setStatus('No mounting holes on this board: switched to corner stands (see "2 · PCB")', 'bad');
  } catch (err) { setStatus('Import failed: ' + err.message, 'bad'); }
});
$('manRect').onclick = () => {
  const W = +$('manW').value, H = +$('manH').value, i = 4;
  setPcb(S.rectPcb(W, H, [
    { ref: 'H1', u: i, v: i, d: 3.2, use: true }, { ref: 'H2', u: W - i, v: i, d: 3.2, use: true },
    { ref: 'H3', u: W - i, v: H - i, d: 3.2, use: true }, { ref: 'H4', u: i, v: H - i, d: 3.2, use: true }], 'rect ' + W + 'x' + H), true);
};
$('pcbMode').addEventListener('change', (e) => { if (state.pcb) { state.pcb.mode = e.target.value; holeTable(); update(); } });
$('addHole').onclick = () => {
  if (!state.pcb) return;
  state.pcb.holes.push({ ref: 'H' + (state.pcb.holes.length + 1), u: state.pcb.W / 2, v: state.pcb.H / 2, d: 3.2, use: true });
  holeTable(); update();
};

// ------------------------------------------------------------ view (SVG)
const svg = $('view');
let vb = { x: -20, y: -20, w: 700, h: 300 };
const sy = (y) => M.extent.y1 - y; // machine Y up → SVG y down
function applyVb() { svg.setAttribute('viewBox', `${vb.x} ${vb.y} ${vb.w} ${vb.h}`); }
function fit() {
  const ex = M.extent, r = svg.getBoundingClientRect(), pad = 18;
  const w = ex.x1 - ex.x0 + 2 * pad, h = ex.y1 - ex.y0 + 2 * pad;
  const ar = (r.width || 800) / (r.height || 400);
  const vw = w / h > ar ? w : h * ar, vh = vw / ar;
  vb = { x: (ex.x0 + ex.x1) / 2 - vw / 2, y: (ex.y1 - ex.y0) / 2 - vh / 2, w: vw, h: vh };
  applyVb();
}
const el = (tag, attrs, parent) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); if (parent) parent.appendChild(e); return e; };
const css = (v) => getComputedStyle(document.documentElement).getPropertyValue(v).trim();

function drawStatic() {
  const g = $('gStatic');
  g.innerHTML = '';
  const P = M.P;
  for (const pl of M.plates) {
    el('rect', { x: pl.x0, y: sy(pl.y1), width: pl.x1 - pl.x0, height: pl.y1 - pl.y0, rx: 6, fill: css('--plate'), stroke: css('--plate-edge'), 'stroke-width': 0.6 }, g);
    const t = el('text', { x: pl.x0 + 4, y: sy(pl.y1) - 3, 'font-size': 6, fill: css('--muted') }, g);
    t.textContent = pl.name;
  }
  for (const z of M.screws) el('circle', { cx: z.x, cy: sy(z.y), r: 2.8, fill: '#111', stroke: css('--plate-edge'), 'stroke-width': 0.5 }, g);
  for (const z of KO.zones) {
    if (z.type === 'circle') el('circle', { cx: z.x, cy: sy(z.y), r: z.r, fill: css('--zone'), stroke: css('--zone-edge'), 'stroke-width': 0.5, 'stroke-dasharray': '2 1.5' }, g);
    else el('rect', { x: z.x0, y: sy(z.y1), width: z.x1 - z.x0, height: z.y1 - z.y0, fill: css('--zone'), stroke: css('--zone-edge'), 'stroke-width': 0.5, 'stroke-dasharray': '2 1.5' }, g);
    const t = el('text', { x: z.type === 'circle' ? z.x : (z.x0 + z.x1) / 2, y: sy(z.type === 'circle' ? z.y : (z.y0 + z.y1) / 2) + 1.5, 'font-size': 4.5, 'text-anchor': 'middle', fill: css('--zone-edge') }, g);
    t.textContent = z.label;
  }
  // letter labels at both ends, row numbers along the plate edges
  for (const pl of M.plates) {
    for (let i = 0; i < M.nCols; i++) {
      const h = M.holes.find((q) => q.plate === pl.index && q.i === i && q.k === 1);
      for (const x of [2.5, P.length - 2.5]) {
        const t = el('text', { x, y: sy(h.y) + 1.4, 'font-size': 4, 'text-anchor': 'middle', fill: css('--label') }, g);
        t.textContent = h.name.replace(/\d+$/, '');
      }
    }
    for (let k = 1; k <= M.nRows; k++) {
      const h = M.holes.find((q) => q.plate === pl.index && q.k === k && q.i === 0);
      const yEdge = pl.cfg.aAt === 'rear' ? pl.y1 - 4 : pl.y0 + 2.2;
      const t = el('text', { x: h.x, y: sy(yEdge), 'font-size': 3.4, 'text-anchor': 'middle', fill: css('--label') }, g);
      t.textContent = k;
    }
  }
  for (const h of M.holes) {
    if (!h.exists) continue;
    const blocked = KO.blocked.has(h.name);
    const c = el('circle', { cx: h.x, cy: sy(h.y), r: P.holeD / 2 + 0.6, fill: 'rgba(0,0,0,0)', stroke: blocked ? css('--hole-off') : css('--hole'), 'stroke-width': 1.1, 'data-hole': h.name, class: 'hole' }, g);
    el('title', {}, c).textContent = h.name + (blocked ? ' (blocked)' : '');
    if (blocked) {
      el('path', { d: `M${h.x - 2},${sy(h.y) - 2}L${h.x + 2},${sy(h.y) + 2}M${h.x + 2},${sy(h.y) - 2}L${h.x - 2},${sy(h.y) + 2}`, stroke: css('--bad'), 'stroke-width': 0.6, 'pointer-events': 'none' }, g);
    }
  }
}

function drawDyn() {
  const g = $('gDyn');
  g.innerHTML = '';
  drawTrays(g);
  const p = state.pcb;
  if (!p) return drawSel(g);
  // stands under the board
  const rectEl = (r, attrs) => el('rect', { x: r.x0, y: sy(r.y1), width: r.x1 - r.x0, height: r.y1 - r.y0, ...attrs }, g);
  if (RES) RES.stands.forEach((st) => {
    const o = S.standOutline(st);
    el('path', { d: 'M' + o.map((q) => `${q.x.toFixed(2)},${sy(q.y).toFixed(2)}`).join('L') + 'Z', fill: css('--stand'), stroke: css('--stand-edge'), 'stroke-width': 0.5, 'data-stand': st.num, style: 'cursor: pointer' }, g);
    if (st.kind === 'corner') st.parts.walls.forEach((w) => rectEl(w, { fill: css('--stand-edge'), stroke: 'none' }));
    for (const b of st.bolts) {
      el('circle', { cx: b.x, cy: sy(b.y), r: st.D.pocketR, fill: 'none', stroke: css('--stand-edge'), 'stroke-width': 0.4 }, g);
      const t = el('text', { x: b.x, y: sy(b.y) - st.D.boltPadR - 1, 'font-size': 4.2, 'text-anchor': 'middle', 'font-weight': 700, fill: css('--stand-edge') }, g);
      t.textContent = b.name;
    }
  });
  // board
  const bg = el('g', { id: 'pcbGroup', style: 'cursor: move' }, g);
  const r = RES ? RES.rect : S.pcbRect(p, state.place);
  el('rect', { x: r.x0, y: sy(r.y1), width: r.x1 - r.x0, height: r.y1 - r.y0, fill: css('--pcb'), stroke: 'none' }, bg);
  for (const l of p.outline) {
    const d = l.map((q, i) => { const m = S.toMachine(p, state.place, q.u, q.v); return (i ? 'L' : 'M') + m.x.toFixed(2) + ',' + sy(m.y).toFixed(2); }).join('');
    el('path', { d, fill: 'none', stroke: css('--pcb-edge'), 'stroke-width': 0.6 }, bg);
  }
  // origin marker (bbox lower-left) so rotation is visible
  const o = S.toMachine(p, state.place, 0, 0);
  el('circle', { cx: o.x, cy: sy(o.y), r: 1.4, fill: css('--pcb-edge') }, bg);
  const nm = el('text', { x: (r.x0 + r.x1) / 2, y: sy((r.y0 + r.y1) / 2), 'font-size': 5, 'text-anchor': 'middle', fill: '#fff', 'pointer-events': 'none' }, bg);
  nm.textContent = `${p.name} ${state.place.rot}°${state.place.flip ? " · bottom up" : ""}`;
  for (const h of p.mode === 'corners' ? [] : p.holes) {
    const m = S.toMachine(p, state.place, h.u, h.v);
    el('circle', { cx: m.x, cy: sy(m.y), r: h.d / 2, fill: h.use ? '#fff' : 'none', stroke: '#fff', 'stroke-width': 0.4 }, bg);
    if (h.use) { const t = el('text', { x: m.x, y: sy(m.y) + h.d / 2 + 4, 'font-size': 3.6, 'text-anchor': 'middle', fill: '#fff', 'pointer-events': 'none' }, bg); t.textContent = h.ref; }
  }
  if (RES) RES.stands.forEach((st) => {
    const t = el('text', { x: st.pin.x, y: sy(st.pin.y) + 2.2, 'font-size': 6, 'text-anchor': 'middle', fill: css('--stand-edge'), 'font-weight': 800, stroke: css('--plate'), 'stroke-width': 0.4, 'paint-order': 'stroke', 'pointer-events': 'none' }, g);
    t.textContent = st.num;
  });
  drawSel(g);
}

// ------------------------------------------------------------ evaluate + readouts
function setStatus(msg, kind) { const s = $('status'); s.textContent = msg; s.style.color = kind === 'bad' ? css('--bad') : kind === 'ok' ? css('--ok') : css('--muted'); }

function update() {
  if (!M) return;
  $('pX').value = state.place.cx.toFixed(2);
  $('pY').value = state.place.cy.toFixed(2);
  RES = state.pcb ? S.evaluate(M, KO, state.pcb, state.place, ES()) : null;
  refreshTrays();
  drawDyn();
  const ps = $('placeStatus'), sl = $('standList');
  if (!RES) { ps.innerHTML = ''; sl.textContent = ''; setStatus('Load a board', ''); }
  else if (RES.ok) {
    ps.innerHTML = `<span class="okc">✓ ${RES.stands.length} stands fit</span> <span class="muted">(cost ${RES.cost.toFixed(1)})</span>`;
    const e = ES();
    ps.innerHTML += `<div class="muted">Pin ${e.pinLen.toFixed(2)} mm · board top at ${(e.height + e.pcbThick).toFixed(2)} mm above the plate${e.stepH > 0 ? ` · ${e.stepH.toFixed(1)} mm under the board` : ''}</div>` +
      e.notes.map((n) => `<div style="color:var(--warn)">• ${n}</div>`).join('');
    setStatus(`✓ ${RES.stands.length} stands`, 'ok');
  } else {
    ps.innerHTML = '<div class="err">' + RES.problems.map((x) => '• ' + x).join('\n') + '</div>';
    setStatus('✗ ' + (RES.problems[0] || 'does not fit'), 'bad');
  }
  if (RES) {
    sl.textContent = RES.stands.map((st) => {
      const arm = Math.min(...st.bolts.map((b) => Math.hypot(b.x - st.anchor.x, b.y - st.anchor.y)));
      const what = st.kind === 'corner' ? `corner ${st.ref}` : `${st.ref} ⌀${st.d.toFixed(2)}`;
      return `${st.num}  ${what.padEnd(11)} → ${st.bolts.map((b) => b.name).join(' + ').padEnd(10)} arm ${arm.toFixed(1)} mm${st.under ? '  (bolt under PCB)' : ''}`;
    }).join('\n') || '(no stands)';
  }
  // per-stand buttons
  const per = $('perStand');
  per.innerHTML = '';
  if (RES) RES.stands.forEach((st, i) => {
    const b = document.createElement('button');
    b.textContent = `${st.num}.stl`;
    b.onclick = () => exportStl([st], `${st.num}_${st.ref}`);
    per.appendChild(b);
  });
  openpnpOut();
  refreshChips(); renderObjects(); fitSoon();
  const lg = $('legend');
  lg.innerHTML = `<b>${state.cfg.plates.map((pl) => `${pl.name}: ${pl.lower ? 'a–g' : 'A–G'}${pl.prefix ? ' (prefix ' + pl.prefix + ')' : ''}, A at ${pl.aAt}`).join(' · ')}</b><br>` +
    `Grid ${M.nRows} rows × ${M.nCols} letters, ${M.P.pitch} mm pitch. Blue = stands, green = board, red = keep-out. The dot on the board marks its lower-left corner.`;
  saveLocal();
}

function openpnpOut() {
  const o = state.openpnp, out = $('opOut');
  if (!state.pcb || !RES) { out.textContent = ''; return; }
  const origin = state.pcb.origins && state.pcb.origins[o.origin];
  if (!origin) { out.textContent = 'This board has no ' + (o.origin === 'aux' ? 'drill/place origin set' : 'page origin (not imported from KiCad)'); return; }
  const r = S.boardOrigin(M, state.pcb, state.place, origin, o.hole ? { hole: o.hole, x: +o.x || 0, y: +o.y || 0, flipX: o.flipX, flipY: o.flipY } : null);
  let s = `Origin on the plates (from the row-1/front corner): X ${r.plateX.toFixed(2)}  Y ${r.plateY.toFixed(2)}\nRotation ${state.place.rot}° (${state.place.flip ? 'BOTTOM side up' : 'top side up'})`;
  if (r.error) s += '\n' + r.error;
  else if (r.x !== undefined) s += `\nOpenPnP board location: X ${r.x.toFixed(2)}  Y ${r.y.toFixed(2)}  Rot ${state.place.rot}`;
  else s += '\nEnter a reference hole and its jogged machine X/Y to get the OpenPnP location.';
  out.textContent = s;
}
['originSel', 'refHole', 'refX', 'refY', 'flipX', 'flipY'].forEach((id) => $(id).addEventListener('input', () => {
  const o = state.openpnp;
  o.origin = $('originSel').value; o.hole = $('refHole').value.trim(); o.x = $('refX').value; o.y = $('refY').value;
  o.flipX = $('flipX').checked; o.flipY = $('flipY').checked;
  openpnpOut(); saveLocal();
}));

// ------------------------------------------------------------ placement controls
function rotate() { state.place.rot = (state.place.rot + 90) % 360; update(); }
$('rotBtn').onclick = rotate;
window.addEventListener('keydown', (e) => { if ((e.key === 'r' || e.key === 'R') && !/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)) rotate(); });
$('pX').addEventListener('change', (e) => { state.place.cx = +e.target.value; update(); });
$('pY').addEventListener('change', (e) => { state.place.cy = +e.target.value; update(); });
$('snap').addEventListener('input', (e) => { state.snap = +e.target.value || 0; saveLocal(); });
$('prefer').addEventListener('change', (e) => { state.prefer = e.target.value; saveLocal(); });
$('sideUp').addEventListener('change', (e) => { state.place.flip = e.target.value === 'bottom'; update(); });
function rotChecks() {
  const box = $('rotAllowed');
  box.innerHTML = '<span class="muted">Rotations allowed:</span>';
  for (const r of [0, 90, 180, 270]) {
    const l = document.createElement('label'); l.style.margin = '0';
    l.innerHTML = `<input type="checkbox" ${state.rotAllowed.includes(r) ? 'checked' : ''}> ${r}°`;
    l.querySelector('input').onchange = (e) => {
      state.rotAllowed = e.target.checked ? [...new Set([...state.rotAllowed, r])] : state.rotAllowed.filter((x) => x !== r);
      saveLocal();
    };
    box.appendChild(l);
  }
}
function runAuto(local) {
  if (!state.pcb) return setStatus('Load a board first', 'bad');
  setStatus('Searching…', '');
  setTimeout(() => {
    const t0 = performance.now();
    const r = S.autoPlace(M, KO, state.pcb, ES(), {
      rotations: state.rotAllowed, prefer: local ? 'here' : state.prefer,
      from: { x: state.place.cx, y: state.place.cy }, radius: local ? 40 : 0, step: local ? 0.5 : 1, flip: !!state.place.flip,
    });
    if (r.best) { state.place = { ...r.best.place }; update(); setStatus(`✓ placed (${r.tried} positions, ${Math.round(performance.now() - t0)} ms)`, 'ok'); }
    else setStatus('✗ ' + r.reason, 'bad');
  }, 20);
}
$('autoBtn').onclick = () => runAuto(false);
$('refineBtn').onclick = () => runAuto(true);

// ------------------------------------------------------------ pointer: pan / zoom / drag board / block holes
function toUser(e) { const pt = svg.createSVGPoint(); pt.x = e.clientX; pt.y = e.clientY; const q = pt.matrixTransform(svg.getScreenCTM().inverse()); return { x: q.x, y: q.y }; }
let drag = null;
const posMap = () => (TRAYS && TRAYS.op ? state.tray.opos : state.tray.pos); // where dragged trays / feeders are kept
svg.addEventListener('pointerdown', (e) => {
  e.preventDefault(); // no text selection while dragging
  if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
  const u = toUser(e);
  const onTray = e.target.closest && e.target.closest('[data-tray]');
  const onPcb = !onTray && e.target.closest && e.target.closest('#pcbGroup');
  const tnum = onTray ? +onTray.dataset.tray : 0;
  if (onTray) selectObj('holder', tnum, { scroll: true }); else if (onPcb) selectObj('board');
  drag = { mode: onTray ? 'tray' : onPcb ? 'pcb' : 'pan', tnum, tpos0: tnum ? { ...(posMap()[tnum] || {}) } : null, start: u, sx: e.clientX, sy: e.clientY, place0: { ...state.place }, vb0: { ...vb }, moved: false, target: e.target };
  svg.setPointerCapture(e.pointerId);
  svg.classList.add('dragging');
});
svg.addEventListener('pointermove', (e) => {
  if (!drag) return;
  if (Math.hypot(e.clientX - drag.sx, e.clientY - drag.sy) > 3) drag.moved = true;
  if (!drag.moved) return;
  if (drag.mode === 'tray') {
    const u = toUser(e), p0 = drag.tpos0;
    if (p0.j === undefined) return;
    const j = p0.j + Math.round((u.x - drag.start.x) / M.P.pitch), y0 = p0.y0 + Math.round(-(u.y - drag.start.y));
    const cur = posMap()[drag.tnum];
    if (!cur || cur.j !== j || cur.y0 !== y0) { posMap()[drag.tnum] = { j, y0 }; update(); }
  } else if (drag.mode === 'pcb') {
    const u = toUser(e);
    let cx = drag.place0.cx + (u.x - drag.start.x), cy = drag.place0.cy - (u.y - drag.start.y);
    if (state.snap > 0) { cx = Math.round(cx / state.snap) * state.snap; cy = Math.round(cy / state.snap) * state.snap; }
    state.place.cx = cx; state.place.cy = cy;
    update();
  } else {
    const r = svg.getBoundingClientRect(), k = vb.w / r.width;
    vb.x = drag.vb0.x - (e.clientX - drag.sx) * k; vb.y = drag.vb0.y - (e.clientY - drag.sy) * k;
    applyVb();
  }
});
svg.addEventListener('pointerup', () => {
  if (drag && !drag.moved && drag.target && drag.target.dataset && drag.target.dataset.hole) {
    const n = drag.target.dataset.hole;
    const i = state.clickBlocked.indexOf(n);
    if (i >= 0) state.clickBlocked.splice(i, 1); else state.clickBlocked.push(n);
    reparseKeepouts(); drawStatic(); update();
  } else if (drag && !drag.moved && drag.target && drag.target.dataset && drag.target.dataset.stand) {
    selectObj('stand', +drag.target.dataset.stand, { scroll: true });
  }
  drag = null; svg.classList.remove('dragging');
});
svg.addEventListener('wheel', (e) => {
  e.preventDefault();
  const u = toUser(e), f = Math.exp(e.deltaY * 0.0015);
  vb.x = u.x - (u.x - vb.x) * f; vb.y = u.y - (u.y - vb.y) * f; vb.w *= f; vb.h *= f;
  applyVb();
}, { passive: false });
window.addEventListener('resize', fit);
$('fitBtn').onclick = fit;
$('themeBtn').onclick = () => {
  const r = document.documentElement, cur = r.dataset.theme || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  r.dataset.theme = cur === 'dark' ? 'light' : 'dark';
  try { localStorage.setItem(LS_KEY + '.theme', r.dataset.theme); } catch (e) { /* ignore */ }
  drawStatic(); update();
};

// ------------------------------------------------------------ export
function download(name, data, type) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([data], { type }));
  a.download = name; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}
const baseName = () => (state.pcb ? state.pcb.name : 'board').replace(/[^\w.-]+/g, '_');
function exportStl(stands, suffix) {
  if (!window.jscadModeling) return setStatus('JSCAD did not load (vendor/jscad-modeling.min.js)', 'bad');
  setStatus('Building solids…', '');
  setTimeout(() => {
    try {
      const geoms = S.printLayout(stands, ES(), window.jscadModeling);
      download(`${baseName()}_${suffix}.stl`, S.stlBinary(geoms, window.jscadModeling), 'model/stl');
      setStatus(`✓ ${stands.length} stand(s) exported`, 'ok');
    } catch (err) { setStatus('STL failed: ' + err.message, 'bad'); }
  }, 20);
}
function exportOk() {
  if (!RES || !RES.stands.length) { setStatus('Nothing to export', 'bad'); return false; }
  return RES.ok || confirm('The placement has problems:\n' + RES.problems.join('\n') + '\n\nExport anyway?');
}
$('stlAllBtn').onclick = () => { if (exportOk()) exportStl(RES.stands, 'stands'); };
// one STL per stand in a folder inside a .zip (each file is a single closed solid, so the slicer loads them as separate objects)
$('stlBtn').onclick = () => {
  if (!exportOk()) return;
  if (!window.jscadModeling) return setStatus('JSCAD did not load (vendor/jscad-modeling.min.js)', 'bad');
  setStatus('Building solids…', '');
  setTimeout(() => {
    try {
      const dir = `${baseName()}_stands/`, sp = ES();
      const files = RES.stands.map((st) => ({
        name: `${dir}${st.num}_${String(st.ref).replace(/[^\w.-]+/g, '_')}.stl`,
        data: new Uint8Array(S.stlBinary(S.printLayout([st], sp, window.jscadModeling), window.jscadModeling)),
      }));
      download(`${baseName()}_stands.zip`, S.zipStore(files), 'application/zip');
      setStatus(`✓ ${files.length} STL files in ${baseName()}_stands.zip`, 'ok');
    } catch (err) { setStatus('STL failed: ' + err.message, 'bad'); }
  }, 20);
};
$('scadBtn').onclick = () => {
  if (!RES || !RES.stands.length) return setStatus('Nothing to export', 'bad');
  const meta = `${baseName()} at X ${state.place.cx.toFixed(2)} Y ${state.place.cy.toFixed(2)} rot ${state.place.rot}`;
  download(`${baseName()}_stands.scad`, S.scadSource(RES.stands, ES(), meta), 'text/plain');
};
// ------------------------------------------------------------ print sheet: placement map + loading list (pnp_sheet.js)
/** what's on the plates now, as plain data for PnpSheet.sheetDocument (plate coordinates, mm) */
function sheetModel() {
  const p = state.pcb, sp = ES(), tp = state.tray.tp, lines = state.tray.bom ? state.tray.bom.lines : [];
  const shortV = (l) => { const v = String(l.value).split(' / ')[0].replace(/ \d+(\.\d+)?V\b/, '').replace(/ (X7R|X5R|C0G|NP0|1%|5%)$/, ''); return v.length <= 9 ? v : l.refs[0] || v.slice(0, 9); };
  const refsTxt = (refs) => (refs.length > 5 ? `${refs.length} places` : refs.join(' '));
  const model = {

/** taught fiducials with both numbers, as fit_fiducials wants them */
function taughtFids() {

/** is the export going to be in machine coordinates? {ok, plate, msg} */
function machineReady() {

  if (f === 'hole') {

function openpnpBuild() {

    trays: TRAYS && TRAYS.pk ? { pk: TRAYS.pk, pl: TRAYS.pl } : null, opulo: TRAYS && TRAYS.op ? { op: TRAYS.op, pl: TRAYS.pl } : null, tp: state.tray.tp,

  if (opts.tab !== false) rtab('objects');
  renderObjects(); drawDyn();
  if (opts.scroll) { const o = document.querySelector('#objList .obj.sel'); if (o) o.scrollIntoView({ block: 'nearest' }); }
}
function rtab(name) {
  document.querySelectorAll('.rtabs button').forEach((b) => b.classList.toggle('on', b.dataset.rtab === name));
  $('rObjects').hidden = name !== 'objects'; $('rParts').hidden = name !== 'parts';
}
document.querySelectorAll('.rtabs button').forEach((b) => { b.onclick = () => rtab(b.dataset.rtab); });
function renderObjects() {
  const list = $('objList'), hs = holderList(), word = TRAYS && TRAYS.op ? 'Feeders' : 'Trays';
  // a selection that no longer exists (board closed, fewer feeders) falls back to its group / the board
  if (SEL.k === 'stand' && !(RES && RES.stands.some((s) => s.num === SEL.n))) SEL = { k: RES ? 'stands' : 'board' };
  if (SEL.k === 'holder' && !hs.some((h) => h.n === SEL.n)) SEL = { k: hs.length ? 'holders' : 'board' };
  if (SEL.k === 'holders' && !TRAYS) SEL = { k: 'board' };
  const rows = [];
  const mark = (ok) => (ok ? '<span class="st okc">✓</span>' : '<span class="st" style="color:var(--bad)">✗</span>');
  rows.push({ k: 'board', html: `<span class="dot" style="background:var(--pcb-edge)"></span>${state.pcb ? escH(state.pcb.name) : 'Board (none open)'}${state.pcb ? `<span class="st muted">${state.place.rot}°${state.place.flip ? ' · bottom up' : ''}</span>` : ''}`, cls: 'grp' });
  if (RES) {
    rows.push({ k: 'stands', html: `<span class="dot" style="background:var(--stand-edge)"></span>Stands (${RES.stands.length})${mark(RES.ok)}`, cls: 'grp' });
    for (const st of RES.stands) rows.push({ k: 'stand', n: st.num, html: `${st.num} · ${escH(st.kind === 'corner' ? 'corner ' + st.ref : st.ref)}<span class="st muted">${st.bolts.map((b) => b.name).join(' + ')}</span>`, cls: 'kid' });
  }
  if (TRAYS) {
    rows.push({ k: 'holders', html: `<span class="dot" style="background:var(--tray-edge)"></span>${word} (${hs.length})${mark(hs.length && hs.every((h) => h.p && h.p.ok))}`, cls: 'grp' });
    for (const h of hs) rows.push({ k: 'holder', n: h.n, html: `${h.name} · ${escH(h.sub)}<span class="st ${h.p && h.p.ok ? 'muted' : ''}" ${h.p && h.p.ok ? '' : 'style="color:var(--bad)"'}>${h.p && h.p.ok ? h.p.bolts.map((b) => b.name).join(' + ') : '✗ ' + escH(h.p ? h.p.why : 'not placed')}</span>`, cls: 'kid' });
    const hand = state.tray.bom ? state.tray.bom.lines.filter((l) => !l.use).length : 0;
    if (hand) rows.push({ k: 'parts', html: `<span class="dot" style="background:var(--muted)"></span>Hand placed (${hand})<span class="st muted">Parts tab</span>`, cls: 'grp' });
  }
  list.innerHTML = '';
  for (const r of rows) {
    const d = document.createElement('div');
    d.className = `obj ${r.cls}${SEL.k === r.k && (r.n == null || SEL.n === r.n) ? ' sel' : ''}`;
    d.innerHTML = r.html;
    d.onclick = () => (r.k === 'parts' ? rtab('parts') : selectObj(r.k, r.n));
    list.appendChild(d);
  }
  renderProps();
}
function renderProps() {
  const show = (id, on) => $(id).classList.toggle('show', !!on);
  const hs = holderList(), word = TRAYS && TRAYS.op ? 'feeder' : 'tray';
  show('propBoard', SEL.k === 'board'); show('propStands', SEL.k === 'stands'); show('propStand', SEL.k === 'stand');
  show('propHolders', SEL.k === 'holders'); show('propHolder', SEL.k === 'holder');
  const t = $('propTitle');
  if (SEL.k === 'board') t.textContent = state.pcb ? `Board · ${state.pcb.name}` : 'Board: open a .kicad_pcb (top bar)';
  if (SEL.k === 'stands') t.textContent = `Stands${RES ? ` (${RES.stands.length})` : ''}`;
  if (SEL.k === 'holders') t.textContent = `${word[0].toUpperCase() + word.slice(1)}s (${hs.length})`;
  if (SEL.k === 'stand' && RES) {
    const st = RES.stands.find((s) => s.num === SEL.n);
    t.textContent = `Stand ${st.num}`;
    const arm = Math.min(...st.bolts.map((b) => Math.hypot(b.x - st.anchor.x, b.y - st.anchor.y)));
    $('propStand').innerHTML = `<div class="kv"><span>Board hole</span><span>${escH(st.kind === 'corner' ? 'corner ' + st.ref : st.ref)}${st.d ? ` ⌀${st.d.toFixed(2)}` : ''}</span>` +
      `<span>Bolts to</span><b>${st.bolts.map((b) => b.name).join(' + ')}</b><span>Arm</span><span>${arm.toFixed(1)} mm${st.under ? ' (a bolt is under the board)' : ''}</span>` +
      `<span>Height</span><span>${ES().height} mm (left, 3)</span></div><div class="row"><button id="oneStl">${st.num}.stl</button><button id="allStands">All stands…</button></div>`;
    $('oneStl').onclick = () => exportStl([st], `${st.num}_${st.ref}`);
    $('allStands').onclick = () => selectObj('stands');
  }
  if (SEL.k === 'holder') {
    const h = hs.find((x) => x.n === SEL.n), p = h.p, ok = p && p.ok;
    t.textContent = `${h.name} · ${h.sub}`;
    let rows = '', parts = 0;
    if (h.f) for (const ch of h.f.channels) for (const s of ch.sections) {
      parts += s.count;
      rows += `<tr data-line="${s.id}"><td>C${ch.num}</td><td><b>${s.id}</b></td><td>${escH(s.line.value.split(' / ')[0])}</td><td>${s.count}${s.refill ? ` +${s.refill}` : ''}</td><td>${s.tape.toFixed(0)}</td><td>${s.a0.toFixed(0)}</td></tr>`;
    }
    if (h.t) h.t.lanes.forEach((l, k) => l.sections.forEach((s) => {
      parts += s.count;
      rows += `<tr data-line="${s.id}"><td>L${k + 1}</td><td><b>${s.id}</b></td><td>${escH(s.line.value.split(' / ')[0])}</td><td>${s.count}</td><td>${s.tape.toFixed(0)}</td><td></td></tr>`;
    }));
    $('propHolder').innerHTML = `<div class="kv"><span>Status</span>${ok ? '<span class="okc">✓ fits</span>' : `<span class="err">✗ ${escH(p ? p.why : 'not placed')}</span>`}` +
      `<span>Bolts to</span><b>${ok ? p.bolts.map((b) => b.name).join(' + ') : '–'}</b><span>Parts</span><span>${parts}</span>` +
      (h.f ? `<span>Channels</span><span>${h.f.channels.length} of ${h.f.type.strips} used</span>` : `<span>Size</span><span>${h.t.L.toFixed(1)} × ${h.t.W.toFixed(1)} mm, top ${h.t.T.toFixed(1)}</span>`) + `</div>` +
      `<table><thead><tr><th>${h.f ? 'ch' : 'lane'}</th><th>#</th><th>value</th><th>qty</th><th>cut</th><th>${h.f ? '@ mm' : ''}</th></tr></thead><tbody>${rows}</tbody></table>` +
      `<div class="muted" style="margin-top:4px">Drag it on the plates to move it; <i>Pack + place</i> (top) re-plans all of them.</div><div class="row"><button id="allHolders">All ${word}s…</button></div>`;
    $('allHolders').onclick = () => selectObj('holders');
  }
}
// Parts table: click a line (not its controls) to select the tray / feeder it is in
$('lineTable').addEventListener('click', (e) => {
  if (e.target.closest('input, select')) return;
  const tr = e.target.closest('tr'); if (!tr || !tr.cells[1]) return;
  const id = tr.cells[1].textContent.trim(), hs = holderList();
  const h = hs.find((x) => (x.f ? x.f.channels.some((ch) => ch.sections.some((s) => String(s.id) === id)) : x.t.lanes.some((l) => l.sections.some((s) => String(s.id) === id))));
  if (h) selectObj('holder', h.n, { scroll: true });
});
/** selection outline on the plates */
function drawSel(g) {
  let path = null;
  if (SEL.k === 'board' && state.pcb) { const r = RES ? RES.rect : S.pcbRect(state.pcb, state.place); path = [[r.x0, r.y0], [r.x1, r.y0], [r.x1, r.y1], [r.x0, r.y1]]; }
  if (SEL.k === 'stand' && RES) { const st = RES.stands.find((s) => s.num === SEL.n); if (st) path = S.standOutline(st).map((q) => [q.x, q.y]); }
  if (SEL.k === 'holder') { const h = holderList().find((x) => x.n === SEL.n); if (h && h.p && h.p.rect) { const r = h.p.rect; path = [[r.x0, r.y0], [r.x1, r.y0], [r.x1, r.y1], [r.x0, r.y1]]; } }
  if (!path) return;
  el('path', { d: 'M' + path.map((q) => `${q[0].toFixed(2)},${sy(q[1]).toFixed(2)}`).join('L') + 'Z', fill: 'none', stroke: css('--accent'), 'stroke-width': 1.2, 'stroke-dasharray': '3 2', 'pointer-events': 'none' }, g);
}

// ------------------------------------------------------------ status chips (one per step, click to jump)
function refreshChips() {
  const box = $('chips');
  if (!box || !M) return;
  const secs = [...document.querySelectorAll('#left > details')];
  const mr = state.pcb && state.pcb.parts ? machineReady() : null;
  const placed = TRAYS ? TRAYS.pl.filter((q) => q && q.ok).length : 0, total = TRAYS ? (TRAYS.op ? TRAYS.op.feeders.length : TRAYS.pk.trays.length) : 0;
  const chips = [
    { t: 'Board', s: state.pcb ? 'ok' : '', sec: 1, sel: 'board', tip: state.pcb ? state.pcb.name : 'open a .kicad_pcb' },
    { t: 'Stands', s: !RES ? '' : RES.ok ? 'ok' : 'bad', sec: 2, sel: 'stands', tip: !RES ? '' : RES.ok ? `${RES.stands.length} fit` : RES.problems[0] },
    { t: 'BOM', s: state.tray.bom ? 'ok' : '', sec: 3, tab: 'parts', tip: state.tray.bom ? state.tray.bom.name : 'open a BOM or DigiKey order' },
    { t: isOpulo() ? 'Feeders' : 'Trays', s: !TRAYS ? '' : placed === total && total ? 'ok' : 'bad', sec: 3, sel: 'holders', tip: TRAYS ? `${placed} of ${total} placed` : '' },
    { t: 'Machine position', s: !mr ? '' : !mr.ok ? 'bad' : mr.plate ? 'warn' : 'ok', sec: 4, tip: mr ? mr.msg : 'needs the board' },
  ];
  box.innerHTML = '';
  for (const c of chips) {
    const b = document.createElement('span');
    b.className = 'chip ' + c.s;
    b.textContent = (c.s === 'ok' ? '✓ ' : c.s === 'bad' ? '✗ ' : c.s === 'warn' ? '⚠ ' : '○ ') + c.t;
    b.title = c.tip || '';
    b.onclick = () => {
      const d = secs[c.sec]; if (d) { d.open = true; d.scrollIntoView({ block: 'start', behavior: 'smooth' }); }
      if (c.sel) selectObj(c.sel); if (c.tab) rtab(c.tab);
    };
    box.appendChild(b);
  }
}

// ------------------------------------------------------------ info icons: hover / focus shows the text in one floating box
function infoIcons() {
  // long field titles become an i next to the field name, so the help is findable (a title only shows on a slow hover)
  document.querySelectorAll('aside label').forEach((lab) => {
    const ctl = lab.querySelector('input[title], select[title]'), span = lab.querySelector(':scope > span');
    if (!ctl || !span || ctl.title.length < 40 || span.querySelector('.info')) return;
    const i = document.createElement('span');
    i.className = 'info'; i.tabIndex = 0; i.textContent = 'i'; i.dataset.tip = ctl.title.replace(/&/g, '&amp;').replace(/</g, '&lt;');
    ctl.removeAttribute('title');
    span.appendChild(i);
  });
  const box = $('tipBox');
  const show = (el) => {
    box.innerHTML = el.dataset.tip; box.style.display = 'block';
    const r = el.getBoundingClientRect(), w = box.offsetWidth, h = box.offsetHeight;
    box.style.left = Math.max(6, Math.min(window.innerWidth - w - 6, r.left - 8)) + 'px';
    box.style.top = (r.bottom + 6 + h > window.innerHeight ? r.top - h - 6 : r.bottom + 6) + 'px';
  };
  const hide = () => { box.style.display = 'none'; };
  document.addEventListener('mouseover', (e) => { const el = e.target.closest && e.target.closest('.info'); if (el) show(el); });
  document.addEventListener('mouseout', (e) => { if (e.target.closest && e.target.closest('.info')) hide(); });
  document.addEventListener('focusin', (e) => { if (e.target.classList && e.target.classList.contains('info')) show(e.target); });
  document.addEventListener('focusout', hide);
  // an i inside a <summary> must not toggle the section
  document.querySelectorAll('summary .info').forEach((el) => el.addEventListener('click', (e) => { e.preventDefault(); e.stopPropagation(); show(el); }));
}

// ------------------------------------------------------------ machine form events
$('profile').addEventListener('change', (e) => {
  const p = S.PROFILES[e.target.value];
  state.profile = e.target.value;
  state.cfg = JSON.parse(JSON.stringify(p));
  state.keepouts = p.keepouts;
  machineFormFromState(); rebuildMachine(); fit();
});
$('nPlates').addEventListener('change', (e) => { setPlateCount(+e.target.value); plateCfgForm(); rebuildMachine(); fit(); });
$('row1').addEventListener('change', (e) => { state.cfg.row1 = e.target.value; rebuildMachine(); });
PL_KEYS.forEach((k) => $('pl_' + k).addEventListener('change', (e) => { const v = +e.target.value; if (isFinite(v) && v >= 0) { state.cfg.plate[k] = v; rebuildMachine(); fit(); } }));
let koTimer = 0;
$('keepouts').addEventListener('input', (e) => {
  state.keepouts = e.target.value;
  clearTimeout(koTimer);
  koTimer = setTimeout(() => { reparseKeepouts(); drawStatic(); update(); }, 250);
});

function initForms() {
  machineFormFromState();
  standFormFromState();
  rotChecks();
  $('prefer').value = state.prefer;
  $('sideUp').value = state.place.flip ? 'bottom' : 'top';
  $('snap').value = state.snap;
  const o = state.openpnp;
  $('originSel').value = o.origin; $('refHole').value = o.hole; $('refX').value = o.x; $('refY').value = o.y;
  $('flipX').checked = o.flipX; $('flipY').checked = o.flipY;
  trayFormFromState();
  $('op_notInTray').value = state.op.notInTray; $('op_plateZ').value = state.op.plateZ; $('op_frame').value = state.op.frame;
  $('op_fidMode').value = state.op.fidMode; $('op_boardZ').value = state.op.boardZ; $('op_fidPart').value = state.op.fidPart; frameVis();
}

// ------------------------------------------------------------ boot
loadLocal();
infoIcons();
try { const t = localStorage.getItem(LS_KEY + '.theme'); if (t) document.documentElement.dataset.theme = t; } catch (e) { /* ignore */ }
initForms();
M = S.buildMachine(state.cfg);
reparseKeepouts();
drawStatic();
holeTable();
fidTable();
fit();
update();
repackTrays(false); // after update(): placement needs the stands
lineTable();
update();
recentSelect();
if (location.hash === '#demo') { $('manRect').click(); state.prefer = 'camera'; runAuto(false); }
if (location.hash === '#demo-corners') { $('manRect').click(); state.pcb.mode = 'corners'; holeTable(); state.prefer = 'camera'; runAuto(false); }
</script>
